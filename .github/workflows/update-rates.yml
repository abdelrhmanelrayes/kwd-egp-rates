name: Update KWD to EGP Bank Rates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Fetch live rates from Kuwaiti banks & Al Mulla
        run: npm run fetch

      - name: Commit updated rates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rates.json
          git diff --staged --quiet || git commit -m "chore: update live KWD/EGP bank rates"
          git push
